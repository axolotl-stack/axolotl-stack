# Parity claims: areas someone is actively working on.
#
# PARITY.md's "Where to help" splits every domain's open rows into free
# families and these claims. Add a claim in your first pull request for an
# area and remove it when you stop; see docs/parity/README.md.
#
# Fields:
#   area      short description of the area
#   owner     `@github-handle` for contributors, `lane NAME` for the
#             maintainers' agent lanes
#   since     date the claim was made (a TOML date, no quotes)
#   domain    status file stem: entities, blocks, items, commands, protocol,
#             worldgen or systems
#   families  row families of that domain (as in PARITY.md's family tables)
#   ids       row ids; each also covers the row's sub-rows
#   prefixes  plain prefixes of row ids
#
# `parity check` rejects unknown domains, families, ids and prefixes, and any
# row covered by two claims. One claim covers one domain; an area spanning
# several domains has one claim per domain.
#
# Protocol and transport rows are unclaimed.

[[claim]]
area = "Mobs: hostile, tameable and aquatic (with dolphins, turtles, axolotls and bats)"
