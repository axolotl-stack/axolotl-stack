# Parity status: Gameplay systems (systems).
# Cross-cutting gameplay systems with no data source to enumerate them from;
# this list is maintained by hand in `crates/parity/src/sources/systems.rs`.
#
# Rows are generated from vanilla data by `cargo run -p parity -- generate`, which
# also rewrites this file in canonical form. Edit only the values; comments are
# regenerated. Schema and rules: docs/parity/README.md.

