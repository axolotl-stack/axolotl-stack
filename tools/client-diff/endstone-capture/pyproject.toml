[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-client-diff"
version = "0.1.0"
description = "Unbatched primary-client packet capture for client-diff"
requires-python = ">=3.10"
dependencies = ["endstone==0.11.12"]

[project.entry-points.endstone]
client_diff = "endstone_client_diff.plugin:ClientDiff"

[tool.setuptools.packages.find]
where = ["src"]
