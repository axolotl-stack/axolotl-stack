name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-25
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true  # Don't fail on warnings for now

      - name: Build
        run: cargo build --workspace

      - name: Test core crates
        run: |
          # Test each core crate individually to avoid feature conflicts
          # (jolyne has ambiguous exports when both raknet and nethernet features enabled)
          cargo test -p tokio-raknet
          cargo test -p valentine
          cargo test -p jolyne --lib --tests
          cargo test -p tokio-nethernet
          cargo test -p axolotl-xbl

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-25

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test core crates
        run: |
          cargo test -p tokio-raknet
          cargo test -p valentine
          cargo test -p jolyne --lib --tests
          cargo test -p tokio-nethernet
          cargo test -p axolotl-xbl

  mutation-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-25

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation tests on diff
        run: |
          cargo mutants --in-diff origin/main \
            -p tokio-raknet \
            -p valentine \
            -p jolyne \
            --timeout 120 \
            -j 2
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: mutants.out/
