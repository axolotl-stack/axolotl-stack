name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libsnappy-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-05
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify checked-in protocolgen output
        run: |
          cargo run -p valentine_gen -- --latest
          cargo fmt --all
          git diff --exit-code -- \
            crates/valentine/bedrock_versions/v1_26_51 \
            crates/valentine/src/bedrock \
            crates/valentine/Cargo.toml

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          # Workspace feature unification never enables every transport feature.
          cargo clippy -p tokio-nethernet --all-targets --all-features -- -D warnings

      - name: Vanilla parity catalog
        # Fails when a generated row has no status, a status names an unknown
        # row, a done/verified row lacks an existing test, or
        # docs/parity/PARITY.md is stale (see docs/parity/README.md).
        run: cargo run -p parity -- check

      - name: Jolyne feature combinations
        run: |
          cargo clippy -p jolyne --lib --no-default-features --features client,raknet -- -D warnings
          cargo clippy -p jolyne --lib --no-default-features --features server,raknet -- -D warnings
          cargo clippy -p jolyne --lib --no-default-features --features server,discovery -- -D warnings
          cargo clippy -p jolyne --lib --no-default-features --features client,nethernet -- -D warnings
          cargo clippy -p jolyne --lib --no-default-features --features server,nethernet -- -D warnings
          cargo clippy -p jolyne --all-targets --all-features -- -D warnings

      - name: Test core crates
        run: |
          cargo test -p tokio-raknet
          cargo test -p valentine
          cargo test -p jolyne --all-features
          cargo test -p tokio-nethernet
          cargo test -p tokio-nethernet --all-features
          cargo test -p axolotl-xbl
          cargo test -p parity
          cargo test -p unastar-rules -p unastar-packs -p unastar-data
          # The movement differential: unastar against the committed BDS
          # traces, the known answers and the other BDS runs.
          cargo test -p bds-sweep
          cargo test -p axelerator
          cargo check -p unastar --all-targets
          cargo test -p unastar --lib --tests
          # Build-time worldgen toolchains; their BDS-install tests skip
          # without UNASTAR_BDS_DIR.
          cargo test -p unastar_noise -p unastar_bedrock_codegen

  movement-harness:
    # The movement differential's own tooling (tools/movement-diff/README.md,
    # "Harness validation"): the comparator and the bedsim runner.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/movement-diff/bedsim-runner/go.mod
          cache-dependency-path: tools/movement-diff/bedsim-runner/go.sum

      - name: Comparator tests
        run: python -m unittest discover -s tools/movement-diff -p "test_*.py"

      - name: bedsim runner
        working-directory: tools/movement-diff/bedsim-runner
        run: |
          go vet ./...
          go test ./...

  knowledge:
    # The project knowledge system (AGENTS.md, openspec/, docs/, agent skills); see docs/README.md.
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: OpenSpec project config parses
        # openspec only warns on a broken config and then ignores the project rules.
        run: |
          bun -e 'const c = Bun.YAML.parse(await Bun.file("openspec/config.yaml").text());
          for (const k of ["context", "rules", "operations"]) if (!c[k]) throw new Error("openspec/config.yaml: missing " + k);'

      - name: OpenSpec specs and changes
        run: bunx @fission-ai/openspec@1.16.0 validate --all --strict --no-interactive

      - name: Agent skills mirrored to .claude/skills
        run: bash tools/agents/sync-skills.sh --check

      - name: Relative Markdown links resolve
        run: bun tools/agents/check-links.ts

      - name: No redacted BDS-internal names in tracked files
        run: bun tools/agents/check-redactions.ts

      - name: No references to the removed thoughts/ folder
        # Historical mentions are fine when the same line says the file was removed
        # (e.g. `origin: thoughts/... (removed; see git history)`).
        run: |
          if git grep -n -I 'thoughts/' -- ':!*.lock' ':!.github' | grep -v -i 'removed'; then
            echo "thoughts/ was replaced by docs/ and openspec/ (see docs/README.md)" >&2
            exit 1
          fi

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static-md snappy:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-05

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test core crates
        run: |
          cargo test -p tokio-raknet
          cargo test -p valentine
          cargo test -p jolyne --all-features
          cargo test -p tokio-nethernet
          cargo test -p tokio-nethernet --all-features
          cargo test -p axolotl-xbl
          cargo test -p axelerator
          cargo check -p unastar --all-targets
          cargo test -p unastar --lib --tests

  mutation-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libsnappy-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-05

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation tests on diff
        run: |
          cargo mutants --in-diff origin/main \
            -p tokio-raknet \
            -p valentine \
            -p jolyne \
            --timeout 120 \
            -j 2
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: mutants.out/
