name: Wire conformance

# Protocolgen reconciles Mojang and Endstone into the canonical manifest used by
# Valentine. This gate verifies that manifest against protocolgen's pinned
# gophertunnel oracle, then proves the checked-in Valentine output regenerates
# without drift and still compiles.

on:
  pull_request:
    paths:
      - "crates/valentine_gen/**"
      - "crates/valentine/bedrock_versions/v1_26_44/**"
      - "crates/valentine/src/bedrock/**"
      - ".github/workflows/wire-conformance.yml"
  push:
    branches: [main]
    paths:
      - "crates/valentine_gen/**"
      - "crates/valentine/bedrock_versions/v1_26_44/**"
      - "crates/valentine/src/bedrock/**"
  workflow_dispatch:

concurrency:
  group: wire-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axolotl
        uses: actions/checkout@v4

      - name: Initialise protocolgen
        run: git submodule update --init crates/valentine_gen/protocolgen

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: crates/valentine_gen/protocolgen/go.sum

      - name: Install Rust from rust-toolchain.toml
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Verify canonical manifest against gophertunnel
        working-directory: crates/valentine_gen/protocolgen
        run: |
          go run ./cmd/protocolgen verify-gophertunnel \
            -manifest generated/1.26.40/manifest.json \
            -report "$RUNNER_TEMP/protocolgen-gophertunnel-report.json"

      - name: Regenerate Valentine and reject drift
        run: |
          cargo run -p valentine_gen -- --latest
          cargo fmt --all
          git diff --exit-code -- \
            crates/valentine/bedrock_versions/v1_26_44 \
            crates/valentine/src/bedrock \
            crates/valentine/Cargo.toml

      - name: Verify generated protocol crate
        run: cargo check -p valentine --no-default-features --features bedrock_1_26_44

      - name: Upload oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocolgen-gophertunnel-report
          path: ${{ runner.temp }}/protocolgen-gophertunnel-report.json
          if-no-files-found: warn
