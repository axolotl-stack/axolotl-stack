name: Update Mojang protocol docs

# Watches Mojang's published protocol documentation and, when the pinned branch
# moves, regenerates the protocol and opens a PR — but only if the regenerated
# output still passes the wire-conformance gate. A docs bump that would desync
# the wire fails here instead of on a live server.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "bedrock-protocol-docs branch to track"
        required: false

concurrency:
  group: protocol-docs-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axolotl
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialise the protocol docs submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init crates/valentine_gen/bedrock-protocol-docs

      - name: Check for a docs update
        id: docs
        run: |
          set -euo pipefail
          dir=crates/valentine_gen/bedrock-protocol-docs

          # Track the branch the submodule is actually pinned to. Mojang's
          # `main` is a LATER protocol than the automated per-version branches,
          # so following main would advertise a protocol live servers reject.
          branch='${{ inputs.branch }}'
          if [[ -z "$branch" ]]; then
            branch="$(git config -f .gitmodules --get submodule.$dir.branch || true)"
          fi
          if [[ -z "$branch" ]]; then
            echo "::error::no branch recorded for $dir; set submodule.<path>.branch in .gitmodules or pass one to workflow_dispatch"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          current="$(git -C "$dir" rev-parse HEAD)"
          git -C "$dir" fetch --quiet --depth 1 origin "$branch"
          latest="$(git -C "$dir" rev-parse FETCH_HEAD)"
          echo "current=$current latest=$latest branch=$branch"

          if [[ "$current" == "$latest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C "$dir" checkout --quiet FETCH_HEAD
          fi

      - name: Confirm the protocol version did not jump
        if: steps.docs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          want="$(jq -r .protocol_version tools/wire-conformance/oracle-pins.json)"
          got="$(jq -r '.["x-protocol-version"]' crates/valentine_gen/bedrock-protocol-docs/json/MobEquipmentPacket.json)"
          if [[ "$got" != "$want" ]]; then
            echo "::warning::docs moved to protocol $got but the oracles are pinned at $want."
            echo "::warning::The conformance gate below will compare across versions and is expected to fail."
            echo "::warning::Bump tools/wire-conformance/oracle-pins.json to an implementation that supports $got first."
          fi

      - name: Install Rust from rust-toolchain.toml
        if: steps.docs.outputs.changed == 'true'
        run: rustup show active-toolchain

      - uses: actions/setup-go@v5
        if: steps.docs.outputs.changed == 'true'
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v4
        if: steps.docs.outputs.changed == 'true'
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2
        if: steps.docs.outputs.changed == 'true'

      - name: Regenerate the protocol
        if: steps.docs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/conformance"
          cd crates/valentine_gen
          cargo run -p valentine_gen -- \
            --source mojang --proto \
            --output-dir ../valentine \
            --emit-wire-manifest "$RUNNER_TEMP/conformance/manifest.json"
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all

      - name: Check out the gophertunnel oracle
        if: steps.docs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ref="$(jq -r .gophertunnel.ref tools/wire-conformance/oracle-pins.json)"
          repo="$(jq -r .gophertunnel.repo tools/wire-conformance/oracle-pins.json)"
          git init --quiet oracle-gophertunnel
          cd oracle-gophertunnel
          git remote add origin "$repo"
          git fetch --quiet --depth 1 origin "$ref"
          git checkout --quiet FETCH_HEAD

      - name: Wire conformance gate
        if: steps.docs.outputs.changed == 'true'
        env:
          WIRE_CONFORMANCE_DIR: ${{ runner.temp }}/conformance
        run: |
          set -euo pipefail
          cd tools/wire-conformance
          go run . "$GITHUB_WORKSPACE/oracle-gophertunnel"
          mv gophertunnel-flat.json gtx2-diagnostics.json "$WIRE_CONFORMANCE_DIR/"
          cd "$GITHUB_WORKSPACE"
          node tools/wire-conformance/compare.mjs

      - name: Verify the regenerated crate compiles
        if: steps.docs.outputs.changed == 'true'
        run: cargo check -p valentine --no-default-features --features bedrock_1_26_40

      - name: Open the regenerated-protocol pull request
        if: steps.docs.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/protocol-docs-update
          delete-branch: true
          add-paths: |
            crates/valentine_gen/bedrock-protocol-docs
            crates/valentine
          commit-message: "chore(protocol): regenerate from updated Mojang docs"
          title: "chore(protocol): regenerate from updated Mojang docs"
          body: |
            Mojang's `${{ steps.docs.outputs.branch }}` moved, so the protocol was regenerated from the new schemas.

            The wire-conformance gate passed against the pinned gophertunnel oracle, meaning no packet
            diverged except those already accepted in `tools/wire-conformance/expected-divergences.json`.

            **Review the schema diff, not just the generated Rust.** A docs update can add a field, change
            a requiredness flag, or renumber an enum, and the gate only catches what the oracle can be read
            for — 51 packets are currently unresolved, and runtime-branching packets can never be checked
            statically. Confirm the protocol version is still one live servers accept before merging.

      - name: Report no change
        if: steps.docs.outputs.changed != 'true'
        run: echo "Mojang ${{ steps.docs.outputs.branch }} is unchanged; nothing to regenerate."
