# Mutation testing configuration for axolotl-stack
# https://mutants.rs/

# Timeout per mutant (seconds)
timeout = 120

# Exclude paths from mutation testing
exclude_globs = [
    # Test files themselves
    "tests/**",
    "benches/**",
    "examples/**",

    # Generated code (no point mutating generated code)
    "**/generated/**",
    "crates/valentine/bedrock_versions/**",   # Generated protocol code (valentine_gen)
    "crates/valentine/src/bedrock/**",        # Generated version re-exports (valentine_gen)
    "crates/valentine_gen/**",                # Code generator (not runtime)

    # unastar-data: only the modules unastar-data-codegen writes. The rest of
    # the crate (loaders, decoders, recipe/loot/actor typing) is hand-written
    # and worth mutating; pack-derived data lives in OUT_DIR, not in src.
    "crates/unastar-data/src/blocks.rs",
    "crates/unastar-data/src/creative.rs",
    "crates/unastar-data/src/items.rs",
    "crates/unastar-data/src/bds_packets.rs",
    "crates/unastar-data/codegen/**",         # Generators (not runtime)
    "crates/unastar-data/datagen/**",

    # External tools
    "crates/bds-extractor/**",
]

# Exclude specific functions that are known to be hard to test or low-value
exclude_re = [
    # Debug formatting
    "fmt.*Debug",
    # Display implementations
    "fmt.*Display",
    # Default implementations (usually trivial)
    "default.*Default",
]

# Only mutate these packages by default (high-priority crates)
# Override with: cargo mutants -p <package>
# packages = ["tokio-raknet", "valentine", "jolyne", "axolotl-xbl", "tokio-nethernet"]
