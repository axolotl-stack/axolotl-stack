[package]
name = "mpsd-poc"
version = "0.1.0"
edition.workspace = true
description = "Security research POC for MPSD session enumeration vulnerability"
license.workspace = true

[[bin]]
name = "mpsd-poc"
path = "src/main.rs"

[dependencies]
# Xbox Live API
axolotl-xbl.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

# CLI
clap = { workspace = true }

# HTTP client (for direct requests if needed)
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

# Time
chrono.workspace = true
