[package]
name = "tokio-nethernet"
version = "0.1.0"
edition.workspace = true
description = "A Tokio-based implementation of the NetherNet protocol (WebRTC transport for Minecraft Bedrock)."
license.workspace = true

[features]
default = []
discovery = ["aes", "hex", "if-addrs"]
endpoint = ["dep:reqwest", "dep:http", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:percent-encoding"]
xbox-signaling = ["dep:tokio-tungstenite", "dep:http", "dep:tungstenite", "dep:uuid", "dep:futures-util"]

[dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "net", "macros"] }
rtc-crypto.workspace = true
rtc-datachannel.workspace = true
rtc-dtls.workspace = true
rtc-ice.workspace = true
rtc-sctp.workspace = true
rtc-sdp.workspace = true
rtc-shared.workspace = true
rtc-stun.workspace = true
rtc-turn.workspace = true
sansio.workspace = true
socket2 = "0.6"
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio-util = { workspace = true, features = ["codec", "compat", "net"] }
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
base64.workspace = true
p384 = { workspace = true, features = ["ecdsa", "pkcs8"] }
parking_lot = "0.12"
# Integer-to-decimal for allocation-free signal and candidate formatting.
itoa = "1"

# Optional crypto dependencies for discovery feature
aes = { workspace = true, optional = true }
# `compress` exposes the raw SHA-256 compression used for midstate HMAC.
# DTLS fingerprints (sha-256/384/512) and the discovery HMAC midstate.
sha2 = { workspace = true, features = ["compress"] }
hex = { workspace = true, optional = true }
# Interface netmasks for per-interface directed discovery broadcasts (the
# client's `LanThreadManager` destinations); rtc-shared has no masks on Windows.
if-addrs = { version = "0.13", optional = true }

# HTTP endpoint signaling (go-nethernet endpoint package).
reqwest = { workspace = true, features = ["rustls-tls", "stream"], optional = true }
http = { workspace = true, optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }

# Retained franchise signaling, independent from the current HTTP endpoint port.
tokio-tungstenite = { workspace = true, features = ["native-tls"], optional = true }
tungstenite = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["full", "test-util"] }
criterion.workspace = true
# Independent WebRTC stack used only as an interop peer in tests.
webrtc.workspace = true
# Reference HMAC for cross-checking the discovery midstate implementation.
hmac.workspace = true

[[example]]
name = "client"
required-features = ["endpoint"]

[[example]]
name = "listener"
required-features = ["endpoint"]

[[example]]
name = "discovery_client"
required-features = ["discovery"]

[[example]]
name = "discovery_server"
required-features = ["discovery"]

[[example]]
name = "real_client_probe"
required-features = ["discovery"]

[[bench]]
name = "signaling_benchmark"
harness = false

[[bench]]
name = "stream_benchmark"
harness = false
