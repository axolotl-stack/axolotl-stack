[package]
name = "unastar-data"
version = "0.1.0"
edition = "2024"
description = "Generated game data for Minecraft Bedrock"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
unastar-packs = { path = "../unastar-packs" }
unastar-rules = { path = "../unastar-rules" }
base64 = { workspace = true }
thiserror = { workspace = true }
serde_path_to_error = "0.1"

[build-dependencies]
bytes = { workspace = true }
sha2 = { workspace = true }
valentine = { path = "../valentine", default-features = false, features = ["bedrock_1_26_51"] }
serde_json = { workspace = true }
unastar-packs = { path = "../unastar-packs" }
unastar-rules = { path = "../unastar-rules" }
quote = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
prettyplease = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
valentine = { path = "../valentine", default-features = false, features = ["bedrock_1_26_51"] }
sha2 = { workspace = true }
tempfile = "3"
