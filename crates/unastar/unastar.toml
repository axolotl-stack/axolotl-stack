# Unastar Server Configuration (TOML)
#
# This file is intentionally verbose and friendly: most fields are optional and
# have safe defaults. Start by changing `server.bind_address` and `spawn_rules`.
#
# Notes:
# - `[[spawn_rules]]` rules are evaluated top-to-bottom. The first rule that produces
#   a spawn location wins.
# - `previous_position = true` uses `players.data_dir` to load a per-player file.
#   If a player has never joined before (or has no UUID), it falls back.

[server]
# Address to bind the Bedrock listener to.
# Loopback by default so local runs never open a public port (and never trigger a
# firewall prompt). Use "0.0.0.0:19132" to accept players from other machines.
bind_address = "127.0.0.1:19132"

# Shown in server list (if/when advertisement is implemented).
motd = "Unastar Server"

# Soft maximum: connection acceptance still depends on upstream layers.
max_players = 20

# Default gamemode for new players.
default_gamemode = "survival"

# World difficulty at startup: "peaceful", "easy", "normal" or "hard".
# Operators change it while the server runs with `/difficulty`.
difficulty = "easy"

# Chunk radius we will *advertise* to clients and stream.
# (Clients may request a different radius; we clamp it by `max_chunk_radius`.)
default_chunk_radius = 4
max_chunk_radius = 12

# Authentication settings
# Xbox Live authentication. Set to false for offline/cracked clients.
online_mode = true
# Allow legacy JWT chains (self-signed/guest). Required for stress testing.
allow_legacy_auth = true
# Enable encryption handshake. Set to false for debugging.
encryption_enabled = true
# Require clients to accept advertised resource packs.
require_resource_packs = false
# Bound the entire authenticated join, including packs and streamed spawn setup.
handshake_timeout_seconds = 30

# Optional NetherNet HTTP signaling alongside RakNet. Omit this table to disable.
# HTTP carries offers/status; WebRTC still requires reachable UDP ICE candidates.
# TLS may be terminated by a reverse proxy. Authentication stays online_mode.
# [server.nethernet]
# bind_address = "127.0.0.1:18086"
# signing_key_path = "data/nethernet-signing-key.der"
# negotiation_timeout_seconds = 15
# max_pending_connections = 64
# relay_only = false
# [[server.nethernet.ice_servers]]
# urls = ["stun:stun.example.org:3478"]
# For a TURN service, configure its turn: URL, username and password here.

[world]
# Dimension ID: 0 = Overworld, 1 = Nether, 2 = End
dimension = 0

# Storage provider: "level_db" (Bedrock-compatible) or "blaze_db".
storage_provider = "level_db"
# BlazeDB cache capacity in chunks (used only with "blaze_db").
blazedb_cache_chunks = 4096
# Chunk generation worker threads (0 = half the cores, at most 8).
generation_threads = 0

[world.bounds]
# Bounds are applied to *terrain generation* (non-air). Chunks outside bounds
# still exist as all-air so the Bedrock client can mesh borders correctly.
#
# modes: "infinite" | "radius" | "rect"
mode = "infinite"
# radius_chunks = 256
# min_x = -64
# max_x = 64
# min_z = -64
# max_z = 64

[world.generator]
# kinds: "super_flat" | "void_spawn_platform" | "java" | "java_terrain" | "bedrock"
# java_terrain needs no game files: set preset to overworld, nether or end,
# matching world.dimension. It includes built-in biome features, excludes
# authored structures/template fossils, and does not change the full java kind.
# kind = "java_terrain"
# preset = "overworld"
# "bedrock" needs --features bedrock-worldgen and UNASTAR_BDS_DIR at build time.
kind = "java"
seed = 12345
# For void worlds (kind = "void_spawn_platform"), generate a stone platform at chunk
# coords [-r..r]:
# platform_radius_chunks = 1

[world_storage]
# Primary identity and storage. Keep the directory and world.toml with world data.
name = "default"
data_dir = "worlds/default"
# Only for operator-verified legacy data with no manifest; not a force-reset option.
adopt_existing = false

# Additional dimension example. Each needs its own directory and fixed spawn fallback.
# [[secondary_worlds]]
# name = "lower"
# data_dir = "worlds/lower"
# [secondary_worlds.world]
# dimension = 1
# [secondary_worlds.world.generator]
# kind = "java_terrain"
# seed = 12345
# preset = "nether"
# [[secondary_worlds.spawn_rules]]
# previous_position = true
# always_at_location = true
# location = { x = 0.5, y = 65.62, z = 0.5 }

[players]
# Where Unastar stores per-player files (e.g. last known position).
data_dir = "playerdata"

# If true, Unastar writes a player's last known position on disconnect (legacy TOML format).
save_previous_position = true

# Enable LevelDB-based player persistence (recommended).
leveldb_enabled = true

# Save player data on disconnect (requires leveldb_enabled).
save_on_disconnect = true

# Spawn rules.
#
# Common patterns:
# - Always spawn at a fixed location:
#     always_at_location = true
#     location = { x = 0.5, y = 17.0, z = 0.5, yaw = 0.0, pitch = 0.0 }
#
# - Prefer previous position, fallback to fixed spawn:
#     previous_position = true
#     always_at_location = true
#     location = { ... }
#
# - No location at all: generated worlds ("java") use the generator's spawn search
#   (Java's world-spawn rules, computed once per server start); flat and void worlds use
#   their template spawn.

[[spawn_rules]]
name = "main"

# If true, try to place returning players at their last saved position.
previous_position = true

# If true, force a fixed spawn location (or act as a fallback if previous position is missing).
always_at_location = false

# Spawn location in *block coordinates* (floats allowed for smoother centering).
# `yaw` and `pitch` are optional. Unset: the generator picks the spawn.
# location = { x = 0.5, y = 17.0, z = 0.5, yaw = 0.0, pitch = 0.0 }

[plugins]
# Required manifest IDs must be present and initialize before listeners start.
# A runtime callback failure stops simulation and fences connected player state.
required = []

[plugins.storage]
# Durable namespaces are separate from plugin filesystem capability preopens.
directory = "data/plugins"
max_value_bytes = 16777216
max_namespace_bytes = 67108864
max_keys = 1024
