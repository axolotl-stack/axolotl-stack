[package]
name = "unastar"
version = "0.1.0"
edition.workspace = true

[features]
default = []
# Bedrock-style world generator compiled from a local BDS 1.26.51 install.
# Needs UNASTAR_BDS_DIR at build time (see README, "Bedrock-style generator").
bedrock-worldgen = ["dep:unastar_bedrock_codegen", "dep:smallvec"]
# Java Edition structure templates for the Java-style generator, read at build
# time from the server jar named by UNASTAR_JAVA_SERVER_JAR (Mojang assets,
# never committed). Without it `world.generator.kind = "java"` is rejected.
java-worldgen = ["unastar_noise/java-templates"]

[dependencies]
bytes.workspace = true
jolyne = { workspace = true, features = ["server", "raknet"] }
unastar_noise.workspace = true
unastar-data.workspace = true
unastar-rules = { path = "../unastar-rules" }
tokio = { workspace = true, features = ["full"] }
tokio-raknet.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
p384.workspace = true
rand.workspace = true
zuri_nbt.workspace = true
valentine = { workspace = true, default-features = false, features = ["bedrock_1_26_51"] }
serde.workspace = true
thiserror.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
glam.workspace = true
uuid.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
async-trait.workspace = true
bleveldb.workspace = true
serde_json.workspace = true
sha2.workspace = true
anyhow = "1.0"
smallvec = { version = "1.15", optional = true }

# BlazeDB dependencies
lru = "0.12"
parking_lot = "0.12"
lz4_flex = "0.11"
crc32fast = "1.4"

# Plugin dependencies (Component Model)
wasmtime = { version = "41.0", features = ["component-model", "async"] }
wasmtime-wasi = "41.0"

#dhat = "0.3"
# tracy-client = "0.18"
bitflags = "2.6"

[build-dependencies]
unastar_bedrock_codegen = { path = "../unastar_bedrock_codegen", optional = true }

[dev-dependencies]
flate2.workspace = true
crc32c = "0.6"
tempfile = "3"
unastar-packs = { path = "../unastar-packs" }

[[example]]
name = "bedrock_decoration_smoke"
required-features = ["bedrock-worldgen"]
