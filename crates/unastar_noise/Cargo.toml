[package]
name = "unastar_noise"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[features]
default = []
# Enable debug logging for worldgen verification (FlatCache grid positions, lookup indices, etc.)
debug-worldgen = []
# Embed the Java Edition structure templates (`data/minecraft/structure/*.nbt`)
# from the local server jar named by `UNASTAR_JAVA_SERVER_JAR` (Mojang assets:
# read at build time, never committed). Required by the Java-style generator's
# structures and fossils.
java-templates = []

[dependencies]
# Runtime dependencies - none for now, types are self-contained

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2"
unastar-packs = { path = "../unastar-packs" }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
prettyplease = { workspace = true }
flate2 = { workspace = true }
md5 = { package = "md-5", version = "0.10" }
unastar-packs = { path = "../unastar-packs" }
