[[mask]]
field = "actor_runtime_id"
rule = "runtime_id"
reason = "Runtime IDs are allocated per server; entities are compared by order of first appearance."

[[mask]]
field = "actor_unique_id"
rule = "unique_id"
reason = "Unique IDs are allocated per server; entities are compared by order of first appearance."

[[mask]]
path = "actor_data.data[id=5].payload"
packets = [
    "SetActorData",
    "AddActor",
    "AddItemActor",
]
rule = "unique_id"
reason = "Metadata key 5 (owner) holds a unique ID."

[[mask]]
field = "net_id_variant"
rule = "stack_id"
reason = "Stack network IDs come from a per-server counter; stacks are compared by order of first appearance."

[[mask]]
field = "item_stack_net_id"
rule = "stack_id"
reason = "Stack network IDs come from a per-server counter; stacks are compared by order of first appearance."

[[mask]]
field = "inputtick"
rule = "ignore"
reason = "Server tick numbers start at different values on each server and session."

[[mask]]
field = "position"
packets = ["AddItemActor"]
rule = "ignore"
reason = "Block and item drops spawn at a random offset inside the block."

[[mask]]
field = "velocity"
packets = ["AddItemActor"]
rule = "ignore"
reason = "Block and item drops get a random initial velocity."

[[mask]]
field = "velocity"
packets = ["AddActor"]
rule = "ignore"
reason = "Dispensed arrows leave with a random spread."

[[mask]]
field = "new_position_x"
packets = ["MoveActorDelta"]
rule = "ignore"
reason = "The only moving actors are dispensed arrows and dropped items, which start with a random spread, offset and velocity, so every position they report is random."

[[mask]]
field = "new_position_y"
packets = ["MoveActorDelta"]
rule = "ignore"
reason = "The only moving actors are dispensed arrows and dropped items, which start with a random spread, offset and velocity, so every position they report is random."

[[mask]]
field = "new_position_z"
packets = ["MoveActorDelta"]
rule = "ignore"
reason = "The only moving actors are dispensed arrows and dropped items, which start with a random spread, offset and velocity, so every position they report is random."
