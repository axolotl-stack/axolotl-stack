[package]
name = "valentine"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde.workspace = true
bitflags.workspace = true
bytes.workspace = true
uuid.workspace = true
valentine_bedrock_core.workspace = true
valentine_bedrock_1_26_0 = { path = "bedrock_versions/v1_26_0", optional = true }
valentine_bedrock_1_26_30 = { path = "bedrock_versions/v1_26_30", optional = true }
valentine_bedrock_1_26_40 = { path = "bedrock_versions/v1_26_40", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-raknet.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
futures.workspace = true
flate2.workspace = true
anyhow.workspace = true
criterion.workspace = true

[features]
default = ["bedrock_1_26_30"]
bedrock_1_26_0 = ["dep:valentine_bedrock_1_26_0"]
bedrock_1_26_30 = ["dep:valentine_bedrock_1_26_30"]
bedrock_1_26_40 = ["dep:valentine_bedrock_1_26_40"]

[[bench]]
name = "codec"
harness = false
